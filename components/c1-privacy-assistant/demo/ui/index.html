<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C1 Privacy Check</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #222; line-height: 1.45;
         display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; }
  header h1 { font-size: 1.2em; margin: 0; }
  header p { font-size: 0.85em; color: #666; margin: 2px 0 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .row { display: flex; margin-bottom: 12px; }
  .row.mine { justify-content: flex-end; }
  .bubble { max-width: 75%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;
            white-space: pre-wrap; word-wrap: break-word; }
  .mine .bubble { background: #eef3fb; }
  .theirs .bubble { background: #f6f6f6; }
  .who { font-size: 0.8em; color: #666; margin-bottom: 4px; }
  .masked { background: #fff; border: 1px solid #ddd; padding: 6px; margin: 4px 0 8px; }
  .label { font-weight: bold; }
  .error { color: #b00020; }
  .low { color: #1b7f1b; font-weight: bold; }
  .medium { color: #b36b00; font-weight: bold; }
  .high { color: #b00020; font-weight: bold; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: #333; }
  table { border-collapse: collapse; margin: 4px 0; white-space: normal; }
  th, td { border: 1px solid #ccc; padding: 2px 8px; text-align: left; font-size: 0.9em; }
  ul { margin: 4px 0; padding-left: 20px; white-space: normal; }
  footer { border-top: 1px solid #ddd; padding: 8px 16px; }
  #text { width: 100%; height: 70px; font: inherit; padding: 6px; box-sizing: border-box; }
  .controls { display: flex; justify-content: space-between; margin-top: 6px; }
  select, button { font: inherit; padding: 4px 8px; }
  #sample { max-width: 260px; }
  .t-PATIENT_NAME { background: #ffd6d6; }
  .t-NIC { background: #ffe0b3; }
  .t-PHONE { background: #fff3a8; }
  .t-MRN { background: #d4f0d4; }
  .t-EMAIL { background: #d6e8ff; }
  .t-DOB { background: #e6dcff; }
</style>
</head>
<body>
<header>
  <h1>C1 Privacy Check</h1>
  <p>Demo page. Sample notes are generated test data. Nothing typed here is stored or logged.</p>
</header>

<div id="messages"></div>

<footer>
  <textarea id="text" placeholder="Type a message. Enter sends, Shift+Enter starts a new line."></textarea>
  <div class="controls">
    <select id="sample"><option value="">Samples</option></select>
    <button id="send">Send</button>
  </div>
</footer>

<script>
let samples = [];

// Fetch the sample notes from C1 and put them in the Samples dropdown
async function loadSamples() {
  const reply = await fetch("/demo/samples");
  samples = await reply.json();
  const select = document.getElementById("sample");
  samples.forEach(function (sample, index) {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = sample.label;
    select.appendChild(option);
  });
}

// Copy the chosen sample into the text box, then reset the dropdown
function useSample() {
  const select = document.getElementById("sample");
  if (select.value !== "") {
    document.getElementById("text").value = samples[select.value].text;
    document.getElementById("text").focus();
  }
  select.value = "";
}

// Enter sends the message; Shift+Enter adds a new line
function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
}

// Make an element with an optional class and plain text (never HTML)
function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

// Add a message row to the chat, on the right for mine and on the left for C1
function addBubble(isMine, title) {
  const row = makeElement("div", "row " + (isMine ? "mine" : "theirs"));
  const bubble = makeElement("div", "bubble");
  bubble.appendChild(makeElement("div", "who", title));
  row.appendChild(bubble);
  document.getElementById("messages").appendChild(row);
  return bubble;
}

// Keep the newest message in view
function scrollToBottom() {
  const area = document.getElementById("messages");
  area.scrollTop = area.scrollHeight;
}

// Send the text box contents to C1 and show both sides of the exchange
async function send() {
  const box = document.getElementById("text");
  const text = box.value;
  if (text.trim() === "") return;
  box.value = "";
  const textHolder = makeElement("div", "", text);
  addBubble(true, "You").appendChild(textHolder);
  scrollToBottom();
  setBusy(true);
  try {
    const result = await postAnalyze(text);
    showHighlights(textHolder, text, result.entities);
    addReply(text, result);
  } catch (problem) {
    addBubble(false, "C1").appendChild(makeElement("div", "error", problem.message));
  }
  setBusy(false);
  scrollToBottom();
}

// Turn the Send button off while C1 is working, and back on after
function setBusy(busy) {
  const button = document.getElementById("send");
  button.disabled = busy;
  button.textContent = busy ? "Checking" : "Send";
}

// Call the demo only route; it needs no service key and returns no raw values
async function postAnalyze(text) {
  const reply = await fetch("/demo/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text }),
  });
  if (!reply.ok) {
    throw new Error("C1 could not check this message (error " + reply.status + ").");
  }
  return reply.json();
}

// Redraw my own message with a coloured background behind each detected identifier
function showHighlights(holder, text, entities) {
  holder.textContent = "";
  let position = 0;
  entities.forEach(function (entity) {
    holder.appendChild(document.createTextNode(text.slice(position, entity.start)));
    const mark = makeElement("span", "t-" + entity.type, text.slice(entity.start, entity.end));
    mark.title = entity.type;
    holder.appendChild(mark);
    position = entity.end;
  });
  holder.appendChild(document.createTextNode(text.slice(position)));
}

// Build C1's reply bubble from the analysis result
function addReply(text, result) {
  const bubble = addBubble(false, "C1");
  bubble.appendChild(makeElement("div", "label", "What leaves C1:"));
  bubble.appendChild(makeElement("div", "masked", result.masked_text));
  addLine(bubble, "Masked: ", result.masking_percentage + " % of the characters", "");
  addLine(bubble, "Risk level: ", result.risk.overall_level, result.risk.overall_level.toLowerCase());
  if (result.reid.level !== "Low") {
    bubble.appendChild(buildSuggestions(text, result.reid));
  }
  bubble.appendChild(buildTokens(result.tokens));
  bubble.appendChild(buildDetails(result));
}

// Add one "label: value" line, with an optional colour class on the value
function addLine(parent, label, value, valueClass) {
  const line = makeElement("div");
  line.appendChild(makeElement("span", "label", label));
  line.appendChild(makeElement("span", valueClass, value));
  parent.appendChild(line);
}

// The re-identification advice: what to change, and the safer wording of the whole message
function buildSuggestions(text, reid) {
  const part = makeElement("div");
  part.appendChild(makeElement("p", "", reid.explanation));
  const list = makeElement("ul");
  reid.items.forEach(function (item) {
    const original = text.slice(item.start, item.end);
    list.appendChild(makeElement("li", "", "Change \"" + original + "\" to \"" + item.suggestion + "\""));
  });
  part.appendChild(list);
  part.appendChild(makeElement("div", "label", "Safer wording:"));
  part.appendChild(makeElement("div", "masked", reid.masked_with_suggestions));
  return part;
}

// Make a plain table from header names and rows of values
function makeTable(headers, rows) {
  const table = makeElement("table");
  const headRow = makeElement("tr");
  headers.forEach(function (name) { headRow.appendChild(makeElement("th", "", name)); });
  table.appendChild(headRow);
  rows.forEach(function (values) {
    const row = makeElement("tr");
    values.forEach(function (value) { row.appendChild(makeElement("td", "", String(value))); });
    table.appendChild(row);
  });
  return table;
}

// Make a collapsed section that opens when its title is clicked
function makeSection(title, content) {
  const section = makeElement("details");
  section.appendChild(makeElement("summary", "", title));
  section.appendChild(content);
  return section;
}

// Collapsed list of placeholder tokens, with types only and never the original values
function buildTokens(tokens) {
  if (tokens.length === 0) {
    return makeSection("Placeholder tokens (none)", makeElement("p", "", "Nothing was masked."));
  }
  const rows = tokens.map(function (token) { return [token.token, token.type, token.count]; });
  return makeSection("Placeholder tokens", makeTable(["Token", "Type", "Times used"], rows));
}

// Collapsed technical details: each explicit identifier and the separate risk levels
function buildDetails(result) {
  const content = makeElement("div");
  const rows = result.entities.map(function (entity) {
    return [entity.type, entity.source, entity.confidence];
  });
  if (rows.length > 0) {
    content.appendChild(makeTable(["Identifier type", "Found by", "Confidence"], rows));
  }
  content.appendChild(makeTable(["Check", "Score", "Level"], [
    ["Explicit identifiers", result.risk.explicit.score, result.risk.explicit.level],
    ["Re-identification", result.reid.score, result.reid.level],
  ]));
  content.appendChild(makeElement("p", "", "Name detector: " + result.name_detector
    + ". Time in C1: " + result.latency_ms + " ms."));
  return makeSection("Details", content);
}

document.getElementById("sample").addEventListener("change", useSample);
document.getElementById("send").addEventListener("click", send);
document.getElementById("text").addEventListener("keydown", handleKey);
loadSamples();
</script>
</body>
</html>
