[project]
name = "c3-policy-scanner"
version = "0.1.0"
description = "MediGuard C3 RAG output policy scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "pdfplumber>=0.11",
  "watchdog>=4",
  "python-multipart>=0.0.9",
  "chromadb>=0.5",
  "jsonschema>=4",
]

[project.optional-dependencies]
# Real embedder and generator (inference on CPU)
models = [
  "torch>=2.2",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
]
# Offline training on a GPU machine or Colab
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "pyarrow>=15",
]
dev = [
  "pytest>=8",
  "jsonschema>=4",
  "reportlab>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c3 = ["demo/ui/*", "demo/policies/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["chroma: needs the real ChromaDB package"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = ["training/notebooks"]   # Colab magics and long shell lines

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]          # sample policy text and long assertions
"src/c3/api/*.py" = ["B008"]   # FastAPI declares File(...) and Depends(...) in defaults
"src/c3/demo/gateway.py" = ["B008", "E501"]
"src/c3/demo/*.py" = ["E501"]                # demo text and messages
"src/c3/training/public/*.py" = ["E501"]     # source descriptions and prompts
"src/c3/training/rules_bank.py" = ["E501"]   # hand-written prose data
"tools/smoke_real_models.py" = ["E501"]       # hand-written test answers
