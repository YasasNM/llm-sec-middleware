[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediguard-c4-risk"
version = "0.1.0"
description = "MediGuard AI C4: Heuristic Cross-Session User Risk Profiler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pymongo>=4.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mongomock>=4.1", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
